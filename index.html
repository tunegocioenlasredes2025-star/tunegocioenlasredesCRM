<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Se sacó el selector de tema. Esto limpia la preferencia guardada: sin
       esta línea, quien había elegido "oscuro" quedaba encerrado ahí para
       siempre, porque ya no queda ningún botón para volver. -->
  <script>try{localStorage.removeItem('tnr_tema');}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TNR · Sistema Operativo</title>
  <!-- El icono de la pestaña. Antes apuntaba a logo.png, que mide 1080x1350 y
       tiene medio lienzo en blanco: en 16px se veía un puntito perdido.
       favicon.png es el mismo logo recortado al dibujo y cuadrado. -->
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png?v=41" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b2240" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TNR CRM" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=41" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=41" />
</head>
<body>
  <!-- Pantalla de login. Se muestra sola si no hay sesión (ver auth.js). -->
  <div id="login" class="login-screen" hidden></div>

  <!-- Bienvenida con el logo, entre la contraseña y el CRM. -->
  <div id="splash" class="splash" hidden></div>

  <div id="app" hidden>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="logo.png" alt="Tu Negocio En Las Redes" onerror="this.onerror=null;this.src='logo.svg'" /></div>
        <div class="brand-text">
          <strong>Tu Negocio</strong>
          <span>En Las Redes</span>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-group">Día a día</div>
        <button class="nav-item active" data-view="hoy"><span class="nav-ic" data-ic="sun"></span> Hoy</button>
        <button class="nav-item" data-view="tareas"><span class="nav-ic" data-ic="check-square"></span> Tareas</button>
        <button class="nav-item" data-view="proyectos"><span class="nav-ic" data-ic="folder"></span> Proyectos</button>

        <div class="nav-group">Comercial</div>
        <button class="nav-item" data-view="prospectos"><span class="nav-ic" data-ic="target"></span> Prospección</button>
        <button class="nav-item" data-view="clientes"><span class="nav-ic" data-ic="users"></span> Clientes</button>

        <div class="nav-group">Medición</div>
        <button class="nav-item" data-view="productividad"><span class="nav-ic" data-ic="bar-chart"></span> Productividad</button>
        <button class="nav-item" data-view="dashboard"><span class="nav-ic" data-ic="dashboard"></span> Panel de prospectos</button>

        <!-- Campañas y Metas del mes salieron del menú porque no se usaban y
             recargaban la navegación. El código NO se borró: campanas.js,
             campanas-vista.js y las vistas de metas siguen enteros y funcionando.
             Para devolverlos, alcanza con reponer estos dos botones:
             <button class="nav-item" data-view="campanas"><span class="nav-ic" data-ic="send"></span> Campañas</button>
             <button class="nav-item" data-view="metas"><span class="nav-ic" data-ic="trophy"></span> Metas del mes</button> -->

        <div class="nav-group">Configuración</div>
        <button class="nav-item" data-view="rutinas"><span class="nav-ic" data-ic="repeat"></span> Rutinas</button>
        <button class="nav-item" data-view="agenda"><span class="nav-ic" data-ic="calendar"></span> Mi semana</button>
        <button class="nav-item" data-view="avisos"><span class="nav-ic" data-ic="bell"></span> Recordatorios</button>
        <button class="nav-item" data-view="calendario"><span class="nav-ic" data-ic="calendar"></span> Calendario</button>
        <button class="nav-item" data-view="notificaciones"><span class="nav-ic" data-ic="bell"></span> Notificaciones <span class="badge-count" id="notifBadge" hidden>0</span></button>
      </nav>

      <div class="cloud-status" id="cloudStatus"><span class="cs-dot"></span><span id="cloudStatusText">Conectando</span></div>

      <div class="user-box" id="userBox" hidden>
        <div class="user-ic" data-ic="user"></div>
        <div class="user-txt"><strong id="userName">—</strong><span id="userMail">—</span></div>
        <button class="icon-btn" id="btnSalir" title="Cerrar sesión" data-ic="log-out"></button>
      </div>

      <!-- El selector de tema salió: una sola identidad, menos ruido en la barra.
           El CSS de ambos temas sigue en styles.css. -->

      <div class="sidebar-foot">
        <button class="btn-ghost" id="btnExport" title="Descargar copia de seguridad"><span data-ic="download"></span> Backup</button>
        <button class="btn-ghost" id="btnImport" title="Restaurar copia"><span data-ic="upload"></span> Restaurar</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menú" data-ic="menu"></button>
        <div class="search-wrap">
          <span class="search-ic" data-ic="search"></span>
          <input type="search" id="globalSearch" placeholder="Buscar: inmobiliarias, Morón, ganados, web…" autocomplete="off" />
        </div>
        <div class="topbar-actions">
          <button class="btn-primary" id="btnQuickAdd"><span data-ic="plus"></span><span class="btn-label">Nuevo prospecto</span></button>
        </div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">Título</h2>
        <button class="modal-close" id="modalClose" aria-label="Cerrar" data-ic="x"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="icons.js?v=41"></script>
  <script src="config.js?v=41"></script>
  <script src="auth.js?v=41"></script>
  <script src="tel.js?v=41"></script>
  <script src="data.js?v=41"></script>
  <script src="sistema.js?v=41"></script>
  <script src="recordatorios.js?v=41"></script>
  <script src="campanas.js?v=41"></script>
  <script src="parser.js?v=41"></script>
  <script src="so-vista.js?v=41"></script>
  <script src="app.js?v=41"></script>
  <script src="campanas-vista.js?v=41"></script>
</body>
</html>
