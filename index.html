<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TNR · Sistema Operativo</title>
  <link rel="icon" href="logo.png" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b2240" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TNR CRM" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="logo.png" alt="Tu Negocio En Las Redes" onerror="this.onerror=null;this.src='logo.svg'" /></div>
        <div class="brand-text">
          <strong>Tu Negocio</strong>
          <span>En Las Redes</span>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-ic" data-ic="dashboard"></span> Dashboard</button>
        <button class="nav-item" data-view="prospectos"><span class="nav-ic" data-ic="target"></span> Prospectos</button>
        <button class="nav-item" data-view="buscar"><span class="nav-ic" data-ic="map-pin"></span> Buscar Negocios</button>
        <button class="nav-item" data-view="clientes"><span class="nav-ic" data-ic="users"></span> Clientes</button>
        <button class="nav-item" data-view="calendario"><span class="nav-ic" data-ic="calendar"></span> Calendario</button>
        <button class="nav-item" data-view="tareas"><span class="nav-ic" data-ic="check-square"></span> Tareas</button>
        <button class="nav-item" data-view="productividad"><span class="nav-ic" data-ic="clock"></span> Productividad</button>
        <button class="nav-item" data-view="notificaciones"><span class="nav-ic" data-ic="bell"></span> Notificaciones <span class="badge-count" id="notifBadge" hidden>0</span></button>
      </nav>
      <div class="cloud-status" id="cloudStatus"><span class="cs-dot"></span><span id="cloudStatusText">Conectando…</span></div>
      <div class="sidebar-foot">
        <button class="btn-ghost" id="btnExport" title="Descargar copia de seguridad"><span data-ic="download"></span> Backup</button>
        <button class="btn-ghost" id="btnImport" title="Restaurar copia"><span data-ic="upload"></span> Restaurar</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menú" data-ic="menu"></button>
        <div class="search-wrap">
          <span class="search-ic" data-ic="search"></span>
          <input type="search" id="globalSearch" placeholder="Buscar: inmobiliarias, Morón, ganados, web…" autocomplete="off" />
        </div>
        <div class="topbar-actions">
          <button class="btn-primary" id="btnQuickAdd"><span data-ic="plus"></span><span class="btn-label">Nuevo prospecto</span></button>
        </div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">Título</h2>
        <button class="modal-close" id="modalClose" aria-label="Cerrar" data-ic="x"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="icons.js?v=13"></script>
  <script src="config.js?v=13"></script>
  <script src="data.js?v=13"></script>
  <script src="parser.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
